services:
  fleet-wa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-wa-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - redis
    volumes:
      - ./.wa-auth:/app/.wa-auth
      - ./data:/app/data
      - ./assets:/app/assets:ro
      - ./logs:/app/logs
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fleet-wa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  redis_data: